packages:
  - apps/*
  - libs/*
  - tools/*
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: false
  lmdb: false
  msgpackr-extract: true
  nx: true
  sharp: true
  unrs-resolver: true
  '@nestjs/core': false

  '@tailwindcss/oxide': true
saveExact: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.1'
  - lucide-react@1.57.0
  - playwright-core@1.64.1
  - playwright@1.64.1
  - react-dom@19.3.1
  - react@19.3.1
